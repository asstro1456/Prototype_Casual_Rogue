<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>프리즘 리콜 — 심플 라인 프로토타입</title>
  <link rel="stylesheet" href="./styles.css?v=0.3.0">
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-label="프리즘 리콜 게임 화면">
      <header class="topbar">
        <div class="title-lockup">
          <p class="eyebrow">PRISM RECALL // SIMPLE LINE PROTOTYPE</p>
          <h1>프리즘 리콜</h1>
          <span class="header-version" data-app-version>v0.3.0 · SIMPLE LINE</span>
        </div>
        <button id="helpButton" class="icon-button" type="button" aria-label="게임 방법 보기">?</button>
      </header>

      <section class="run-status" aria-label="런 진행 상태">
        <div class="round-copy">
          <span id="blockLabel">BLOCK A</span>
          <strong id="roundLabel">ROUND 1 / 4</strong>
        </div>
        <div class="round-track" aria-hidden="true">
          <i data-round-dot="1"></i>
          <i data-round-dot="2"></i>
          <i data-round-dot="3"></i>
          <i data-round-dot="4"></i>
        </div>
      </section>

      <section class="combat-hud">
        <div class="hud-item">
          <span>보호막</span>
          <strong id="shieldDisplay" aria-label="남은 보호막"></strong>
        </div>
        <div class="hud-item">
          <span>남은 적</span>
          <strong id="enemyCountDisplay" aria-label="남은 적 수">0</strong>
        </div>
      </section>

      <section class="enemy-zone">
        <div class="enemy-meta">
          <div>
            <span id="patternLabel" class="pattern-badge">온보딩형</span>
            <h2 id="enemyName">기억체 01</h2>
          </div>
          <p id="roundGoal">아래로 진격하는 적을 저지하세요.</p>
        </div>

        <div class="portrait-stage">
          <div class="party-portrait" aria-hidden="true">
            <div class="portrait-halo"></div>
            <div class="memory-tower"></div>
            <div class="fighter melee-fighter">
              <i class="fighter-head"></i>
              <i class="fighter-body"></i>
              <i class="fighter-weapon"></i>
              <b>VANGUARD</b>
            </div>
            <div class="fighter archer-fighter">
              <i class="fighter-head"></i>
              <i class="fighter-body"></i>
              <i class="fighter-weapon"></i>
              <b>ARCHER</b>
            </div>
          </div>
          <div id="crystalGrid" class="crystal-grid" role="grid" aria-label="5열 전투선"></div>
          <div id="damageFlash" class="damage-flash" aria-hidden="true"></div>
        </div>

        <div class="progress-row">
          <span>웨이브 처리</span>
          <div class="progress-bar"><i id="clearProgress"></i></div>
          <strong id="clearPercent">0%</strong>
        </div>
      </section>

      <section class="action-zone">
        <div class="section-heading">
          <span>캐릭터 선택</span>
          <small id="tapCount">탭 0회</small>
        </div>
        <div id="actionChoices" class="action-choices character-actions" aria-label="전사 또는 궁수 선택"></div>
        <div class="action-footer">
          <p id="feedbackText" role="status">번호가 표시된 공격 후보 하나를 탭하세요.</p>
        </div>
      </section>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop is-open">
    <section id="modalPanel" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <span class="modal-version" data-app-version>v0.3.0 · SIMPLE LINE</span>
      <p id="modalEyebrow" class="eyebrow">4 ROUND PLAYTEST</p>
      <h2 id="modalTitle">넓게 베고, 깊게 꿰뚫으세요</h2>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </section>
  </div>

  <script src="./app.js?v=0.3.0"></script>
</body>
</html>
